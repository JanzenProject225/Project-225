<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>Project 225</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f4f4f5;color:#18181b}main{max-width:820px;margin:auto;padding:24px}h1{font-size:42px;margin:0}.sub{color:#71717a}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:22px 0}.card,button{border:1px solid #d4d4d8;border-radius:18px;background:white;padding:18px}button{font-size:18px;font-weight:700;min-height:64px}.hero{text-align:center;padding:32px 20px}.timer{font-size:72px;font-weight:800;font-variant-numeric:tabular-nums;margin:20px 0}.exercise{font-size:32px;font-weight:800}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.primary{background:#18181b;color:white}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{text-align:center;padding:10px 2px;font-size:13px}.done{background:#dcfce7}.hidden{display:none}@media(max-width:600px){main{padding:16px}.timer{font-size:58px}.exercise{font-size:27px}.week{grid-template-columns:repeat(4,1fr)}} </style></head><body><main><h1>PROJECT 225</h1><p class="sub">Consistency first. Strength • Boxing • Walking</p><section class="card"><b>This week</b><div id="week" class="week"></div></section><div class="grid"><button data-plan="A">Strength A + Boxing</button><button data-plan="B">Strength B + Boxing</button><button data-plan="BOX">Boxing Only</button><button data-plan="W">Walk</button></div><section id="player" class="card hero hidden"><div id="phase" class="sub"></div><div id="exercise" class="exercise"></div><div id="detail" class="sub"></div><div id="timer" class="timer">READY</div><div id="progress" class="sub"></div><div class="controls"><button id="prev">Previous</button><button id="start" class="primary">START</button><button id="next">Next</button></div></section></main><script>
const box=()=>Array.from({length:5},(_,i)=>({p:'BOXING',n:`Round ${i+1} of 5`,d:['Jab • Jab-Cross • Move','Jab-Cross • Reset • Move','Jab-Cross-Hook • Move','Mix clean combinations','Finish controlled'][i],s:60,r:60}));
const plans={A:[{p:'STRENGTH',n:'Goblet Squat',d:'2 × 8'},{p:'STRENGTH',n:'Dumbbell Bench Press',d:'2 × 8'},{p:'STRENGTH',n:'Assisted Pull-Ups',d:'2 × 5'},{p:'STRENGTH',n:'Dumbbell Romanian Deadlift',d:'2 × 8'},...box()],B:[{p:'STRENGTH',n:'Kettlebell Deadlift',d:'2 × 10'},{p:'STRENGTH',n:'One-Arm Dumbbell Row',d:'2 × 8 each side'},{p:'STRENGTH',n:'Seated Dumbbell Shoulder Press',d:'2 × 8'},{p:'STRENGTH',n:'Assisted Pull-Ups',d:'2 × 5'},...box()],BOX:box(),W:[{p:'WALK',n:'Project 225 Walk',d:'Comfortable pace. 20 minutes completes it. Continue to 30 if you feel good.',s:1200}]};
let plan=[],i=0,left=0,t=null,running=false,resting=false,chosen=''; const $=x=>document.querySelector(x), fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
function week(){const names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], saved=JSON.parse(localStorage.getItem('p225')||'{}'), now=new Date(); $('#week').innerHTML=''; for(let k=0;k<7;k++){let d=new Date(now);d.setDate(now.getDate()-now.getDay()+k);let key=d.toISOString().slice(0,10),el=document.createElement('div');el.className='day card '+(saved[key]?'done':'');el.innerHTML=`<b>${names[k]}</b><br>${saved[key]||'—'}`;$('#week').appendChild(el)}}
function stop(){clearInterval(t);t=null;running=false;$('#start').textContent='START'} function draw(){stop();resting=false;let x=plan[i];$('#player').classList.remove('hidden');$('#phase').textContent=x.p;$('#exercise').textContent=x.n;$('#detail').textContent=x.d;left=x.s||0;$('#timer').textContent=x.s?fmt(left):'READY';$('#progress').textContent=`Step ${i+1} of ${plan.length}`}
function complete(){stop();$('#phase').textContent='COMPLETE';$('#exercise').textContent='PROJECT 225 ✓';$('#detail').textContent='You showed up. That counts.';$('#timer').textContent='DONE';let s=JSON.parse(localStorage.getItem('p225')||'{}');s[new Date().toISOString().slice(0,10)]=chosen==='W'?'Walk':chosen==='BOX'?'Box':'Strength';localStorage.setItem('p225',JSON.stringify(s));week()}
function advance(){i<plan.length-1?(i++,draw()):complete()} function countdown(done){running=true;$('#start').textContent='PAUSE';t=setInterval(()=>{left--;$('#timer').textContent=fmt(Math.max(0,left));if(left<=0){stop();done()}},1000)}
function run(){let x=plan[i];if(running){stop();$('#start').textContent='RESUME';return}if(!x.s){advance();return}countdown(()=>{if(x.p==='BOXING'&&!resting&&x.r){resting=true;left=x.r;$('#phase').textContent='REST';$('#exercise').textContent='Breathe + Reset';$('#detail').textContent='Shake out your arms. Next round is coming.';countdown(advance)}else advance()})}
document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{chosen=b.dataset.plan;plan=plans[chosen];i=0;draw()});$('#start').onclick=run;$('#next').onclick=advance;$('#prev').onclick=()=>{if(i>0){i--;draw()}};week();
</script></body></html>
